version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: tewahedo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tewahedo_db
      POSTGRES_USER: tewahedo_user
      POSTGRES_PASSWORD: tewahedo_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tewahedo_user -d tewahedo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: tewahedo_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_tewahedo_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../backend:/app
      - backend_media:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=django-insecure-tewahedo-prod-key-orthodox-spiritual-app
      - DATABASE_URL=postgres://tewahedo_user:tewahedo_secure_password_2026@db:5432/tewahedo_db
      - ALLOWED_HOSTS=*
      - CORS_ALLOW_ALL_ORIGINS=True
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: tewahedo_frontend
    restart: unless-stopped
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "8081:8081"
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
